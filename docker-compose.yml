# รัน:  cp .env.example .env && docker compose up -d --build
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
  DATA_DB_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT}
  REQUEST_DELAY_SECONDS: ${REQUEST_DELAY_SECONDS:-1.5}
  MAX_PRODUCTS_PER_SOURCE: ${MAX_PRODUCTS_PER_SOURCE:-100}
  MAX_FETCHES_PER_SOURCE: ${MAX_FETCHES_PER_SOURCE:-300}
  QUALITY_MAX_INVALID_RATIO: ${QUALITY_MAX_INVALID_RATIO:-0.25}
  QUALITY_MIN_ROWS: ${QUALITY_MIN_ROWS:-20}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init/01-create-airflow-db.sql:/docker-entrypoint-initdb.d/01-create-airflow-db.sql:ro
      - ./dags/bookpipeline/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment: *airflow-env
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - airflow_data:/opt/airflow/data
      - airflow_logs:/opt/airflow/logs
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    command: >
      bash -c "airflow db migrate &&
      (airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD}
      --firstname Admin --lastname User --role Admin --email admin@example.com || true) &&
      (airflow scheduler &) && exec airflow webserver"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_DB_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "${WEB_PORT:-8501}:8501"

volumes:
  pgdata:
  airflow_data:
  airflow_logs:
